# Rebuilds the app into docs/ on every push to main and commits it.
# GitHub Pages serves this repo's branch: index.html sends visitors to the prebuilt app in docs/,
# so docs/ must always hold a fresh build of src/. Nothing to do by hand.
name: Build app into docs/

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build   # vite build → dist/, then copied to docs/
      - name: Commit the new build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "docs/ already up to date"; exit 0; fi
          git commit -m "Build app into docs/ for $(git rev-parse --short HEAD)"
          git push
